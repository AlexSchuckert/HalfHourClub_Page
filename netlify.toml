# Netlify configuration for the Half Hour Club site.
# Netlify reads this automatically when it builds.

[build]
  # Fetch content, build with Eleventy, encrypt every page (see scripts/build.sh)
  command = "bash scripts/build.sh"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # esbuild follows the relative import of scripts/gh-app-token.mjs, which lives
  # outside the functions directory — the two share the token-minting code so
  # there's only ever one machine credential to look after.
  node_bundler = "esbuild"

# Friendly URLs for the two functions the publishing form calls.
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/geocode"
  to = "/.netlify/functions/geocode"
  status = 200

# Fonts and media never change once published (media filenames are content
# hashes), so let browsers keep them.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/clubs/*/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Belt and braces on top of robots.txt — this is a private family archive.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# NOTE: no secrets here. HHC_PASSWORD, HHC_PUBLISH_KEY and the GitHub App
# credentials are set in the Netlify dashboard under
# Site configuration → Environment variables.
